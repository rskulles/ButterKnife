<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ButterKnife app icon: macOS-style rounded square (with the standard transparent margin) in the app's
       purple, with a butter knife embossed into the surface. Source of truth for the .icns and the favicon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4fd6"/>
      <stop offset="1" stop-color="#4b2a8a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd85a"/>
      <stop offset="1" stop-color="#f0a030"/>
    </linearGradient>
    <!-- Knife silhouette in its own 400x150 space as ONE path (rounded handle, bolster, broad blade with an upturned
         rounded tip), so it can be reused inside the clipPath: SVG allows <use> of a shape there, not of a group. -->
    <path id="knife" d="M28 42 H170 C 178 42, 182 48, 182 56 V64 H196 C 204 42, 226 28, 252 28 H326 C 358 28, 388 34, 402 46 C 408 52, 406 62, 400 70 L386 92 C 380 100, 372 104, 360 104 H196 V86 H182 V94 C 182 102, 178 108, 170 108 H28 A33 33 0 0 1 28 42 Z"/>
    <clipPath id="knifeClip"><use href="#knife"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="drop" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Background squircle: 824px centred, corner radius ~22.5% like macOS icons. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Knife: 402 units long scaled to ~640px, tilted from lower-left to upper-right. -->
  <g transform="translate(512 512) rotate(-32) scale(1.6) translate(-201 -75)">
    <use href="#knife" transform="translate(4 8)" fill="#1a0d3a" opacity="0.35" filter="url(#drop)"/>
    <use href="#knife" fill="url(#face)"/>
    <g clip-path="url(#knifeClip)">
      <use href="#knife" transform="translate(-2.5 -2.5)" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" filter="url(#soft)"/>
      <use href="#knife" transform="translate(2.5 2.5)" fill="none" stroke="#7a3a00" stroke-opacity="0.55" stroke-width="5" filter="url(#soft)"/>
    </g>
    <!-- handle grooves and the blade's spine highlight -->
    <path d="M44 68 H160" stroke="#b86a10" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 82 H160" stroke="#b86a10" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 66 H160" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M46 80 H160" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M214 96 H352" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
